name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SCHEME: Caminata
      APP_BUNDLE_ID: ai.1qlabs.caminata
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          DEVICES=$(xcrun simctl list devices available --json)
          UDID=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | test("SimRuntime.iOS")) | .value[] | select(.name | startswith("iPhone"))] | .[0].udid // empty')
          NAME=$(echo "$DEVICES" | jq -r '[.devices | to_entries[] | select(.key | test("SimRuntime.iOS")) | .value[] | select(.name | startswith("iPhone"))] | .[0].name // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this runner"
            xcrun simctl list devices
            exit 1
          fi
          echo "Using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project Caminata.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath artifacts/Caminata.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/xcodebuild.log

      - name: Test summary
        if: always()
        run: |
          [ -f artifacts/xcodebuild.log ] || exit 0
          echo "### Failed or skipped tests"
          grep -E "Test Case .*(failed|skipped)" artifacts/xcodebuild.log \
            || echo "(none: every test ran and passed)"
          echo
          echo "### Totals"
          grep -E "Executed [0-9]+ tests?" artifacts/xcodebuild.log | tail -1

      - name: Collect the map images the tests generated
        if: always()
        run: |
          mkdir -p artifacts/output

          # The app container is where a hosted test bundle writes, but the
          # exact path depends on how the tests were hosted, so fall back to
          # searching the simulator's data containers rather than guessing.
          SOURCE=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" "$APP_BUNDLE_ID" data 2>/dev/null || true)
          FOUND=""
          if [ -n "$SOURCE" ] && [ -d "$SOURCE/Documents/CIOutput" ]; then
            FOUND="$SOURCE/Documents/CIOutput"
          else
            FOUND=$(find ~/Library/Developer/CoreSimulator/Devices \
              -type d -name CIOutput -print -quit 2>/dev/null || true)
          fi

          if [ -n "$FOUND" ]; then
            cp -R "$FOUND/." artifacts/output/
            echo "Collected from $FOUND:"
            ls -lh artifacts/output
          else
            echo "::warning::No CIOutput directory found; the tests wrote nothing to collect."
            echo "App container was: ${SOURCE:-<not installed>}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caminata-ci-output
          path: apps/ios/artifacts/
          if-no-files-found: warn
          retention-days: 14
