name: Caminata

options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # The Personal Team of cardozocristian@gmail.com (a free account): sideloads
    # last seven days and three apps fit on a phone at once. Set here, not on the
    # command line, so a fresh `xcodegen generate` can sign without being told.
    DEVELOPMENT_TEAM: FA737M2U79
    # One version for the app, its widget extension and its watch app: an
    # embedded target whose version differs from its host is flagged on build.
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0

targets:
  Caminata:
    type: application
    platform: iOS
    sources:
      - path: Caminata
      - path: Shared
    dependencies:
      - target: CaminataWidgets
      - target: CaminataWatch
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata
        PRODUCT_NAME: Caminata
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # REVERSED_CLIENT_ID out of GoogleService-Info.plist. Re-copy it if the
        # app is ever re-registered in Firebase: a new app gets a new OAuth
        # client, and the app checks the two against each other at sign-in.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.898210117692-cborph5spgsda15cuvf7smj4smu6pqlb
    info:
      path: Caminata/Resources/Info.plist
      properties:
        CFBundleDisplayName: Caminata
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        # The walk in progress on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: >-
          Caminata registra el recorrido mientras hay una caminata en curso,
          también con la pantalla bloqueada.
        NSPhotoLibraryAddUsageDescription: >-
          Caminata guarda la imagen del mapa de tu caminata en Fotos cuando lo
          pedís.

  CaminataWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CaminataWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: CaminataWidgets/Info.plist
      properties:
        CFBundleDisplayName: Caminata
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CaminataWatch:
    type: application
    platform: watchOS
    sources:
      - path: CaminataWatch
      - path: Shared/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata.watchkitapp
        PRODUCT_NAME: Caminata
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: CaminataWatch/Info.plist
      properties:
        CFBundleDisplayName: Caminata
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.cardozo.caminata
        # It shows the walk the phone is recording; on its own it has nothing.
        WKRunsIndependentlyOfCompanionApp: false

  CaminataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaminataTests
    dependencies:
      - target: Caminata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Caminata:
    build:
      targets:
        Caminata: all
        CaminataTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CaminataTests
