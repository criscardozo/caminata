name: Caminata

options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0

targets:
  Caminata:
    type: application
    platform: iOS
    sources:
      - path: Caminata
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata
        PRODUCT_NAME: Caminata
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # REVERSED_CLIENT_ID out of GoogleService-Info.plist. Re-copy it if the
        # app is ever re-registered in Firebase: a new app gets a new OAuth
        # client, and the app checks the two against each other at sign-in.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.898210117692-cborph5spgsda15cuvf7smj4smu6pqlb
    info:
      path: Caminata/Resources/Info.plist
      properties:
        CFBundleDisplayName: Caminata
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          Caminata records the route you walk while a walk is in progress,
          including when the screen is locked.
        NSPhotoLibraryAddUsageDescription: >-
          Caminata saves the map image of your walk to your photo library when
          you choose to.

  CaminataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaminataTests
    dependencies:
      - target: Caminata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.caminata.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Caminata:
    build:
      targets:
        Caminata: all
        CaminataTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CaminataTests
