<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caminata — history</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#0B3D4A" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Caminata</h1>
      <div id="account" class="account" hidden>
        <span id="account-name"></span>
        <button id="sign-out" type="button" class="ghost">Sign out</button>
      </div>
    </header>

    <main>
      <section id="signed-out" class="panel centred" hidden>
        <h2>Your walks, after the fact</h2>
        <p>
          Sign in with the same Google account you use on the phone, and every
          walk you have finished shows up here.
        </p>
        <button id="sign-in" type="button" class="primary">Sign in with Google</button>
      </section>

      <section id="loading" class="panel centred">
        <p class="muted">Loading…</p>
      </section>

      <section id="empty" class="panel centred" hidden>
        <h2>No walks yet</h2>
        <p class="muted">
          Finish a walk on the phone with this account signed in, and it will
          appear here.
        </p>
      </section>

      <section id="history" class="history" hidden>
        <ul id="walk-list" class="walk-list"></ul>
        <div class="detail">
          <div id="map"></div>
          <div id="detail-stats" class="detail-stats"></div>
        </div>
      </section>

      <section id="error" class="panel centred" hidden>
        <h2>Something went wrong</h2>
        <p id="error-message" class="muted"></p>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
