name: Caminata

options:
  bundleIdPrefix: ai.1qlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Caminata:
    type: application
    platform: iOS
    sources:
      - path: Caminata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.1qlabs.caminata
        PRODUCT_NAME: Caminata
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Caminata/Resources/Info.plist
      properties:
        CFBundleDisplayName: Caminata
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          Caminata uses your location to record the route you walk while a walk
          is in progress.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Caminata keeps recording your route while the app is in the background
          so your walk is not cut short when the screen locks.
        NSPhotoLibraryAddUsageDescription: >-
          Caminata saves the map image of your walk to your photo library when
          you choose to.

  CaminataTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaminataTests
    dependencies:
      - target: Caminata
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.1qlabs.caminata.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Caminata:
    build:
      targets:
        Caminata: all
        CaminataTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CaminataTests
